name: CI

# The suite, on every push, on all three platforms.
#
# Until this existed the only workflow was the release one, so the Rust tests
# ran on Windows exactly once per release: after the archive had been built,
# and only if someone published a tag. The playback path was broken there for a
# whole release without anything saying so.
on:
  # A branch with an open pull request would otherwise run the whole matrix
  # twice for every push, and report both.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
          - os: macos-14
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # The webview toolchain the crate links against. macOS and Windows carry
      # theirs; only Linux needs them installed.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - run: npm ci

      # Plain `cargo test`, not `--lib`: the stream server's tests run a
      # compiled stand-in for ffmpeg that lives in `examples/`, and `--lib`
      # does not build it. That stand-in is the whole reason this job means
      # something on Windows.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Frontend tests
        run: npm run test

      - name: Lint
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check

      - name: Build the frontend
        run: npm run build
