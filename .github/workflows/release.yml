name: Release

# Publishing a release builds the portable binaries and attaches them to it.
# Cross-compiling is not an option: each platform needs its own webview
# toolchain, so each one needs its own runner.
#
# Each archive carries the application together with the static `ffmpeg` and
# `ffprobe` it needs to play anything — see scripts/fetch-ffmpeg.sh for where
# those come from and why they are pinned.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the binaries to (empty = dry run, no upload)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # Baked into the binary and written into the index cache. It grows with
      # every run of this workflow, so no two releases claim the same number and
      # a cache written by an earlier one is thrown away rather than read back
      # into a shape that may no longer mean the same thing.
      REELDRIVE_BUILD: ${{ github.run_number }}
      # Shown in the footer. The tag is the only place a release number is
      # written, so nothing in the tree has to be bumped by hand — and a run
      # that is not attached to a tag leaves it empty, which the build fills
      # from `git describe`: the commit, not a release it is not.
      VITE_REELDRIVE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: ReelDrive-macos-arm64.zip
            ffmpeg: macos-arm64
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: ReelDrive-macos-x86_64.zip
            ffmpeg: macos-x86_64
          - os: windows-latest
            label: Windows (x86_64)
            artifact: ReelDrive-windows-x86_64.zip
            ffmpeg: windows-x86_64
          # 24.04 imposes a glibc 2.39 floor on the AppImage.
          - os: ubuntu-24.04
            label: Linux (x86_64)
            artifact: ReelDrive-linux-x86_64.zip
            ffmpeg: linux-x86_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # --- system dependencies ---------------------------------------------

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      # --- build ------------------------------------------------------------

      - run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      # The other half of the suite. Without this the frontend is the only part
      # of the product that reaches a release unexecuted.
      - name: Test the frontend
        run: npm run test

      # `option_env!` answers `None` for a variable that is not there, and
      # `parse_build` reads anything unusable as 0 — the same answer a
      # developer's machine gives. So a typo in the name above, or the `env:`
      # block moving, would ship every release with the cache guard inert and
      # nothing anywhere would say so. This is the only thing that would.
      - name: Check the build number reached the binary
        shell: bash
        working-directory: src-tauri
        run: |
          cargo run --quiet --example build_number \
            | grep -qx "build: $REELDRIVE_BUILD" \
            || { echo "::error::the binary does not carry build $REELDRIVE_BUILD"; exit 1; }

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          npm run tauri build -- --bundles app
          APP=src-tauri/target/release/bundle/macos/ReelDrive.app
          # The tools go inside the bundle, beside the binary, so that tidying
          # up the stick cannot separate them from the app.
          sh scripts/fetch-ffmpeg.sh ${{ matrix.ffmpeg }} "$APP/Contents/MacOS"
          # Adding files to a bundle breaks its seal; re-sign it ad-hoc, which
          # is what the build produced in the first place.
          codesign --force --sign - "$APP"
          cd src-tauri/target/release/bundle/macos
          zip -qry "$GITHUB_WORKSPACE/${{ matrix.artifact }}" ReelDrive.app

      - name: Check the macOS bundle is self-contained
        if: runner.os == 'macOS'
        run: |
          MACOS_DIR=src-tauri/target/release/bundle/macos/ReelDrive.app/Contents/MacOS
          status=0
          for bin in reeldrive ffmpeg ffprobe; do
            if [ ! -x "$MACOS_DIR/$bin" ]; then
              echo "::error::$bin is missing from the bundle"
              status=1
              continue
            fi
            leftovers=$(otool -L "$MACOS_DIR/$bin" | tail -n +2 | awk '{print $1}' \
              | grep -Ev '^@executable_path|^/usr/lib|^/System' || true)
            if [ -n "$leftovers" ]; then
              echo "::error::$bin still depends on external libraries:"
              echo "$leftovers"
              status=1
            fi
          done
          exit $status

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          npm run tauri build -- --bundles appimage
          mkdir -p out
          # The AppImage is a single portable file with the binary's shared
          # libraries inside it.
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/ReelDrive.AppImage
          chmod +x out/ReelDrive.AppImage
          # An AppImage cannot carry them inside: it runs from a read-only
          # mount, so the tools sit next to it, where $APPIMAGE points.
          sh scripts/fetch-ffmpeg.sh ${{ matrix.ffmpeg }} out
          cd out && zip -qr "$GITHUB_WORKSPACE/${{ matrix.artifact }}" \
            ReelDrive.AppImage ffmpeg ffprobe

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run tauri build -- --no-bundle
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri\target\release\reeldrive.exe out\ReelDrive.exe

      # The fetch script is POSIX sh; the runner has bash, so it runs there too.
      - name: Bundle ffmpeg for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: sh scripts/fetch-ffmpeg.sh ${{ matrix.ffmpeg }} out

      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath "${{ matrix.artifact }}" -Force

      # --- publish ----------------------------------------------------------

      # The same failure the build-number check exists for, one layer up: Vite
      # only forwards names starting with `VITE_`, so a rename of the variable
      # above would ship every release footer reading "dev" and nothing else
      # would notice.
      - name: Check the version reached the bundle
        if: env.VITE_REELDRIVE_VERSION != ''
        shell: bash
        run: |
          # -F, because a tag is not a pattern: `0.3.1` as a regexp matches
          # `192,0` and `1:210` in the minified bundle, so without it the check
          # passes on a build the version never reached — which is the one case
          # it exists for.
          grep -qrF -- "\"$VITE_REELDRIVE_VERSION\"" dist/assets \
            || { echo "::error::the frontend does not carry version $VITE_REELDRIVE_VERSION"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.artifact }}" --clobber
